<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile · PlacementTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <script>if(!localStorage.getItem('pt_token'))location.replace('login.html');</script>
</head>
<body>
  <div class="backdrop" id="backdrop"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="mark">PT</span> PlacementTrack</div>
      <nav class="nav">
        <a href="dashboard.html" data-page="dashboard"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
        <a href="applications.html" data-page="applications"><i class="fa-solid fa-briefcase"></i> Applications</a>
        <a href="upcoming.html" data-page="upcoming"><i class="fa-solid fa-calendar-day"></i> Upcoming</a>
        <a href="profile.html" data-page="profile"><i class="fa-solid fa-user"></i> Profile</a>
        <span class="spacer"></span>
        <a href="#" class="nav-logout" data-logout><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="hamburger" id="hamburger"><i class="fa-solid fa-bars"></i></button>
          <div class="greet">
            <h1>Profile</h1>
            <p>Your account details.</p>
          </div>
        </div>
        <div class="topbar-right"><div class="avatar">?</div></div>
      </header>

      <main class="content">
        <div class="state row-loading" id="loading"><div class="spinner"></div> Loading profile…</div>

        <div class="panel profile-card hidden" id="profile-body">
          <div class="profile-head">
            <div class="avatar" id="profile-avatar">?</div>
            <div>
              <h2 id="profile-name">Name</h2>
              <p id="profile-email">email</p>
            </div>
          </div>

          <form id="profile-form">
            <div class="form-grid">
              <div class="full">
                <label class="field-lab">Full name <span class="req">*</span></label>
                <input class="fg-input" name="name" required />
              </div>
              <div class="full">
                <label class="field-lab">Email</label>
                <input class="fg-input" name="email" disabled />
                <small class="muted" style="font-size:12px">Email can't be changed.</small>
              </div>
              <div class="full">
                <label class="field-lab">College</label>
                <input class="fg-input" name="college" />
              </div>
              <div>
                <label class="field-lab">Branch</label>
                <input class="fg-input" name="branch" />
              </div>
              <div>
                <label class="field-lab">Graduation year</label>
                <input class="fg-input" type="number" name="graduation_year" min="2000" max="2100" />
              </div>
            </div>
            <div style="margin-top:22px;display:flex;justify-content:flex-end">
              <button type="submit" class="btn btn-primary" id="save-profile">Save changes</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
